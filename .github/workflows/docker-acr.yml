name: Build and Push Docker Image

# 合并 PR 到发布分支会在远端产生 push，与直接 push 共用下方触发器。
# 镜像：${ACR_REGISTRY}/chroneb/new-api
# Secrets：ACR_REGISTRY、ACR_USERNAME、ACR_PASSWORD。
# ACR_REGISTRY 填公网域名（如 registry.cn-hangzhou.aliyuncs.com），不要填 registry-vpc。
on:
  push:
    branches: [main, ch]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        env:
          TZ: Asia/Shanghai
        with:
          images: ${{ secrets.ACR_REGISTRY }}/chroneb/new-api
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=short
            type=raw,value=ch,enable=${{ github.ref == 'refs/heads/ch' }}
            type=semver,pattern={{version}}

      # 多阶段构建的 bun / go 层不在最终镜像里，mode=max 才能在下次构建复用
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=new-api
          cache-to: type=gha,mode=max,scope=new-api
